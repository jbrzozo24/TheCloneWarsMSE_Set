# NanDeck config for scripts/make_nandeck.py
#
# One filename per line, in the order you want them in the deck.
# - Blank lines and lines starting with '#' are ignored.
# - Bare filenames are resolved against the image folder passed on the CLI.
# - A missing ".png" extension is added automatically when it helps.
# - Absolute paths are also accepted.
# - For multiple copies of a card, add a trailing "xN" / "*N" multiplier,
#   or just list the card on several lines. Both stack.
#
# Usage:
#   python scripts/make_nandeck.py Export/tokens_v1 \
#       --config scripts/tokens_v1.example.cfg \
#       -o nandeck/NanDeckTokensExport.txt

